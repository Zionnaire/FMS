# EFIMS — Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Two native Node web services (no Docker — simpler and more reliable than a Docker build for a
# plain NestJS + Next.js monorepo; see docs/CHANGELOG.md's dated entry for why this was chosen
# over a Dockerfile-based deploy). `rootDir` on each service scopes its build/start commands to
# that service's own subdirectory — commands below are written relative to that root, not the
# repo root. Deploy with `render blueprints launch` (Render CLI) or by connecting this repo in
# the Render dashboard and pointing it at this file.
#
# Neither DATABASE_URL/DIRECT_URL nor GROQ_API_KEY/VAPID keys are defined with real values here —
# every `sync: false` var below is prompted for once, at Blueprint creation, in the Render
# dashboard, and never committed to this file. See each var's own comment for what to paste in,
# and efims-backend/.env.example + efims-frontend/.env.example for the full explanation of each.

services:
  - type: web
    name: efims-backend
    runtime: node
    rootDir: efims-backend
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    # `prisma migrate deploy` is idempotent (only applies pending migrations) — safe to run on
    # every deploy/restart, not just the first one. Kept in startCommand rather than
    # preDeployCommand because preDeployCommand is a paid-plan-only feature; this works on every
    # plan including free.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      # Neon (or any Postgres) connection strings — see efims-backend/.env.example's own detailed
      # comments on DATABASE_URL (pooled, efims_app role) vs DIRECT_URL (unpooled, migration-owner
      # role) for exactly what to paste in. This project was built and verified against Neon.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Auto-generated by Render at first deploy — never set these manually, and never reuse a
      # dev-environment secret here.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PLATFORM_JWT_SECRET
        generateValue: true

      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: PLATFORM_JWT_TTL
        value: 1h

      - key: THROTTLE_TTL_MS
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"

      # Set this ONCE, manually, after both services' first deploy — paste the frontend
      # service's actual public URL from the Render dashboard (e.g.
      # "https://efims-frontend-xxxx.onrender.com"). Deliberately NOT wired via `fromService`:
      # Render's confirmed `fromService` properties (host/port/hostport/etc.) expose a service's
      # *private*-network address, not its public HTTPS URL, and there's no officially-confirmed
      # Blueprint syntax for copying one service's public URL into another's env var — guessing
      # at one here would risk the whole Blueprint failing to deploy. `sync: false` below means
      # Render prompts for this value once, at Blueprint creation.
      - key: CORS_ORIGINS
        sync: false

      # ml-gateway (CLAUDE.md non-negotiable #4 — the only module allowed to call an external
      # AI/ML provider). No real EFIMS AI Service is deployed anywhere yet (see
      # docs/OPEN_ITEMS.md) — ml-gateway degrades to a clean 503 when this is unset/unreachable,
      # not a crash, so leaving it as a placeholder is safe.
      - key: ML_SERVICE_BASE_URL
        value: http://127.0.0.1:8000
      # Paste a real key at https://console.groq.com/keys, or leave the dashboard prompt empty —
      # ml-gateway's severity-fallback and duplicate-detection capabilities both degrade to a
      # clean 503 (not a crash) when this is unconfigured.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Generate ONE pair with `npx web-push generate-vapid-keys` (from efims-backend/) and paste
      # the public half into BOTH this and the frontend's NEXT_PUBLIC_VAPID_PUBLIC_KEY below —
      # they must be byte-for-byte identical, or a subscribed browser's pushes fail to decrypt.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@efims.local

  - type: web
    name: efims-frontend
    runtime: node
    rootDir: efims-frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      # Set these ONCE, manually, after the backend's first deploy — paste its actual public URL
      # from the Render dashboard (e.g. "https://efims-backend-xxxx.onrender.com") into both. See
      # the backend's CORS_ORIGINS above for why this isn't wired automatically via `fromService`.
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_REALTIME_URL
        sync: false

      - key: COOKIES_SECURE
        value: "true"

      # Must be the exact same value as the backend's VAPID_PUBLIC_KEY above (see that var's own
      # comment) — Render has no mechanism to copy one service's secret into another's env var
      # automatically, so this has to be pasted manually, twice, from the one
      # `generate-vapid-keys` run.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
