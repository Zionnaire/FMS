name: CI

# Runs lint, typecheck, build, and a dependency-vulnerability gate for both apps on every PR and
# push to main. The backend e2e suite (test/e2e/) also runs here — see that job's own comment for
# the one-time repository setup it requires (a dedicated test database, never the real dev one).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efims-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: efims-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency audit (fails only on a NEW production-path finding — see audit-baseline.json)
        run: node scripts/audit-guard.js

  backend-e2e:
    name: Backend — e2e test suite
    runs-on: ubuntu-latest
    needs: backend
    # Requires two repository secrets pointing at a dedicated test database — NEVER the real
    # dev/production database. See efims-backend/test/e2e/README.md for how this project's own
    # test database (a separate `efims_test` database on the same Postgres instance as dev, since
    # no Docker is available in this project's primary dev environment) was created; any real
    # Postgres works here, including a fresh one stood up just for CI.
    #   TEST_DATABASE_URL — the efims_app-role, pooled (if applicable) connection string
    #   TEST_DIRECT_URL   — the privileged owner-role, direct connection string (migrations,
    #                       RLS policy application, and this suite's own test-data truncation)
    if: ${{ vars.E2E_DB_CONFIGURED == 'true' }}
    defaults:
      run:
        working-directory: efims-backend
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: efims-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply schema + RLS policies to the test database
        run: |
          npx prisma migrate deploy
          npx prisma db execute --file prisma/rls-policies.sql --schema prisma/schema.prisma
      - name: Write test/e2e/.env.test from CI secrets
        run: |
          cat > test/e2e/.env.test <<EOF
          DATABASE_URL="${DATABASE_URL}"
          DIRECT_URL="${DIRECT_URL}"
          JWT_ACCESS_SECRET="ci-test-access-secret"
          JWT_ACCESS_TTL="15m"
          JWT_REFRESH_SECRET="ci-test-refresh-secret"
          JWT_REFRESH_TTL="7d"
          PORT=3099
          CORS_ORIGINS="http://localhost:3000"
          THROTTLE_TTL_MS=60000
          THROTTLE_LIMIT=100
          PLATFORM_JWT_SECRET="ci-test-platform-secret"
          PLATFORM_JWT_TTL="1h"
          GROQ_API_KEY="dev-only-change-me-groq"
          GROQ_MODEL="openai/gpt-oss-120b"
          EOF
      - name: Run e2e suite
        run: npm run test:e2e

  frontend:
    # No standalone "Typecheck" step, unlike the backend job above — found live, 2026-11-16: Next
    # 16's typed-route global types (`PageProps`/`LayoutProps`) are generated into `.next/types/`
    # as a side effect of `next build`/`next dev` actually running at least once, not present on a
    # fresh checkout. A standalone `tsc --noEmit` *before* `next build` fails with "Cannot find
    # name 'PageProps'" on every single page/layout file, every time, on a clean CI runner — it
    # only ever looked fine locally because this repo's own dev machine had already run `next
    # build`/`next dev` many times, leaving `.next/types/` populated from a previous run.
    # `next build` already runs a real project-wide TypeScript check as part of itself (confirmed:
    # `typescript.ignoreBuildErrors` is not set in next.config.ts) and fails the Build step on a
    # genuine type error — a separate `tsc --noEmit` step adds no real coverage here, only a
    # guaranteed-to-fail ordering bug.
    name: Frontend — lint, build (includes typecheck), audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efims-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: efims-frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src --max-warnings=0
      - name: Build (type-checks the whole project as part of the build)
        run: npm run build
      - name: Dependency audit (fails only on a NEW production-path finding — see audit-baseline.json)
        run: node scripts/audit-guard.js
